# ========================================================
# RENDER BLUEPRINT - SHOW DO TRILHÃO
# Deploy automático do Web Service (Spring Boot) + PostgreSQL
# ========================================================
services:
  - type: web
    name: show-do-trilhao-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: show-do-trilhao-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ADMIN_EMAIL
        value: admin@cptm.sp.gov.br
      - key: ADMIN_PASSWORD
        sync: false
      - key: APRESENTADOR_EMAIL
        value: apresentador@cptm.sp.gov.br
      - key: APRESENTADOR_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://show-do-trilhao.web.app,https://show-do-trilhao.firebaseapp.com
      - key: SWAGGER_ENABLED
        value: false

databases:
  - name: show-do-trilhao-db
    databaseName: show_do_trilhao
    user: trilhao_admin
    plan: free
