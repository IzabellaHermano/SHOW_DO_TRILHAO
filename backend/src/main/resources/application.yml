spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: show-do-trilhao
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:c3B0bS1zaG93LWRvLXRyaWxoYW8tc3VwZXItc2VjcmV0LWtleS1mb3Itand0LTIwMjYtY3B0bQ==}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 horas padrão

admin:
  email: ${ADMIN_EMAIL:admin@cptm.sp.gov.br}
  password: ${ADMIN_PASSWORD:}

apresentador:
  email: ${APRESENTADOR_EMAIL:apresentador@cptm.sp.gov.br}
  password: ${APRESENTADOR_PASSWORD:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080,https://show-do-trilhao-6a86a.web.app,https://show-do-trilhao-6a86a.firebaseapp.com,https://show-do-trilhao.web.app,https://show-do-trilhao.firebaseapp.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
